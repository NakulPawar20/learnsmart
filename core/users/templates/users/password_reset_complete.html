{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - LearnSmart</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" href="{% static 'recommender/images/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recommender/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'recommender/css/login.css' %}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="{% url 'home' %}" class="auth-logo">
            <img src="{% static 'recommender/images/logo.png' %}" alt="LearnSmart logo" class="header-logo">
            LearnSmart
        </a>
        <div class="auth-card">
            <h1 class="auth-title">Password Reset Complete</h1>
            <p class="auth-subtitle">Your password has been set. You may go ahead and log in now.</p>
            <p class="auth-footer">
                <a href="{% url 'login' %}" class="btn btn--primary">Login</a>
            </p>
        </div>
    </div>
</body>
</html>
