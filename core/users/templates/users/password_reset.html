{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - LearnSmart</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" href="{% static 'recommender/images/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recommender/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'recommender/css/login.css' %}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="{% url 'home' %}" class="auth-logo">
            <img src="{% static 'recommender/images/logo.png' %}" alt="LearnSmart logo" class="header-logo">
            LearnSmart
        </a>
        <div class="auth-card">
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password.</p>

            <form method="post" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_email">Email</label>
                    <input type="email" name="email" id="id_email" required autofocus placeholder="Enter your email">
                </div>
                <button type="submit" class="btn btn--primary btn--lg btn--block">Send Reset Email</button>
            </form>
            <p class="auth-footer">
                <a href="{% url 'login' %}">Back to Login</a>
            </p>
        </div>
    </div>
</body>
</html>
