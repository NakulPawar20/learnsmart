{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LearnSmart</title>
    <!-- favicon -->
    <link rel="icon" type="image/png" href="{% static 'recommender/images/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recommender/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'recommender/css/login.css' %}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="{% url 'home' %}" class="auth-logo">
            <img src="{% static 'recommender/images/logo.png' %}" alt="LearnSmart logo" class="header-logo">
            LearnSmart
        </a>
        <div class="auth-card">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to get personalized recommendations</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="auth-error">
                        <p>{{ message }}</p>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" required autofocus placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn--primary btn--lg btn--block">Login</button>
            </form>
            <p class="auth-footer">
                Don't have an account? <a href="{% url 'register' %}">Register here</a>.
                <br>
                <a href="{% url 'password_reset' %}">Forgot password?</a>
            </p>
        </div>
    </div>
</body>
</html>
